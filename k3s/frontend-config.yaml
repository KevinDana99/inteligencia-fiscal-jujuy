  NEXT_PUBLIC_USE_MOCK_AUTH: "true"
  NEXT_PUBLIC_USE_MOCK_ADMIN_PANEL: "true"
  NEXT_PUBLIC_USE_MOCK_CATALOG_SHOWCASE: "true"
  NEXT_PUBLIC_API_BASE_URL: http://rentas-if-backend.rentas-if.svc.cluster.local
