apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-frontend
  namespace: rentas-if
  labels:
    app.kubernetes.io/name: rentas-if-frontend
    app.kubernetes.io/part-of: rentas-if
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rentas-if-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: http
