stages:
  - validar
  - construir
  - promover

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

default:
  tags:
    - rentas-if-k3s-prod
  before_script:
    - set -euo pipefail
    - export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"

variables:
  NODE_IMAGE: docker.io/library/node:22-alpine
  REGISTRY_HOST: gitlab.local.internal:5050
  REGISTRY_IMAGE: gitlab.local.internal:5050/if-rentas/frontend
  K3S_INFRA_REPO: gitlab.kamakia.io/if-rentas/k3s-infra.git
  K3S_INFRA_BRANCH: main
  FRONTEND_PATCH_FILE: overlays/prod/if/patches/frontend-prod-image.yaml
  NEXT_PUBLIC_API_BASE_URL: http://rentas-if-backend.rentas-if.svc.cluster.local
  NEXT_PUBLIC_USE_MOCK_AUTH: "false"
  NEXT_PUBLIC_USE_MOCK_ADMIN_PANEL: "false"
  NEXT_PUBLIC_USE_MOCK_BATCH_MANAGEMENT: "false"
  NEXT_PUBLIC_USE_MOCK_CROSS_MANAGEMENT: "false"
  NEXT_PUBLIC_USE_MOCK_CATALOG_SHOWCASE: "false"
  NEXT_PUBLIC_USE_MOCK_DOCUMENTS: "false"
  NEXT_PUBLIC_USE_MOCK_EXPLORER_REGISTER: "false"
  NEXT_PUBLIC_USE_MOCK_REPROCESSING: "false"
  NEXT_PUBLIC_USE_MOCK_UNIFIED_REGISTER: "false"

validar_frontend:
  stage: validar
  interruptible: true
  script:
    - >
      sudo -n podman run --pull=missing --rm
      -v "$CI_PROJECT_DIR:/src:ro,Z"
      -e NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL"
      -e NEXT_PUBLIC_USE_MOCK_AUTH="$NEXT_PUBLIC_USE_MOCK_AUTH"
      -e NEXT_PUBLIC_USE_MOCK_ADMIN_PANEL="$NEXT_PUBLIC_USE_MOCK_ADMIN_PANEL"
      -e NEXT_PUBLIC_USE_MOCK_BATCH_MANAGEMENT="$NEXT_PUBLIC_USE_MOCK_BATCH_MANAGEMENT"
      -e NEXT_PUBLIC_USE_MOCK_CROSS_MANAGEMENT="$NEXT_PUBLIC_USE_MOCK_CROSS_MANAGEMENT"
      -e NEXT_PUBLIC_USE_MOCK_CATALOG_SHOWCASE="$NEXT_PUBLIC_USE_MOCK_CATALOG_SHOWCASE"
      -e NEXT_PUBLIC_USE_MOCK_DOCUMENTS="$NEXT_PUBLIC_USE_MOCK_DOCUMENTS"
      -e NEXT_PUBLIC_USE_MOCK_EXPLORER_REGISTER="$NEXT_PUBLIC_USE_MOCK_EXPLORER_REGISTER"
      -e NEXT_PUBLIC_USE_MOCK_REPROCESSING="$NEXT_PUBLIC_USE_MOCK_REPROCESSING"
      -e NEXT_PUBLIC_USE_MOCK_UNIFIED_REGISTER="$NEXT_PUBLIC_USE_MOCK_UNIFIED_REGISTER"
      "$NODE_IMAGE"
      sh -lc 'cp -a /src/. /tmp/app && cd /tmp/app && npm ci && NODE_ENV=production npm run build'

construir_imagen:
  stage: construir
  needs:
    - validar_frontend
  interruptible: true
  script:
    - export IMAGE_TAG="$REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - export IMAGE_LATEST="$REGISTRY_IMAGE:prod-latest"
    - sudo -n podman login "$REGISTRY_HOST" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - >
      sudo -n podman build --pull=missing
      --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL"
      --build-arg NEXT_PUBLIC_USE_MOCK_AUTH="$NEXT_PUBLIC_USE_MOCK_AUTH"
      --build-arg NEXT_PUBLIC_USE_MOCK_ADMIN_PANEL="$NEXT_PUBLIC_USE_MOCK_ADMIN_PANEL"
      --build-arg NEXT_PUBLIC_USE_MOCK_BATCH_MANAGEMENT="$NEXT_PUBLIC_USE_MOCK_BATCH_MANAGEMENT"
      --build-arg NEXT_PUBLIC_USE_MOCK_CROSS_MANAGEMENT="$NEXT_PUBLIC_USE_MOCK_CROSS_MANAGEMENT"
      --build-arg NEXT_PUBLIC_USE_MOCK_CATALOG_SHOWCASE="$NEXT_PUBLIC_USE_MOCK_CATALOG_SHOWCASE"
      --build-arg NEXT_PUBLIC_USE_MOCK_DOCUMENTS="$NEXT_PUBLIC_USE_MOCK_DOCUMENTS"
      --build-arg NEXT_PUBLIC_USE_MOCK_EXPLORER_REGISTER="$NEXT_PUBLIC_USE_MOCK_EXPLORER_REGISTER"
      --build-arg NEXT_PUBLIC_USE_MOCK_REPROCESSING="$NEXT_PUBLIC_USE_MOCK_REPROCESSING"
      --build-arg NEXT_PUBLIC_USE_MOCK_UNIFIED_REGISTER="$NEXT_PUBLIC_USE_MOCK_UNIFIED_REGISTER"
      -t "$IMAGE_TAG"
      -t "$IMAGE_LATEST"
      .
    - sudo -n podman push "$IMAGE_TAG"
    - sudo -n podman push "$IMAGE_LATEST"

promover_k3s_infra_prod:
  stage: promover
  needs:
    - construir_imagen
  resource_group: rentas-if-k3s-infra-prod
  when: manual
  script:
    - |
      set -euo pipefail

      IMAGE_TAG="${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      WORKDIR="/tmp/k3s-infra-frontend-${CI_PIPELINE_ID}"

      rm -rf "$WORKDIR"

      git clone --branch "$K3S_INFRA_BRANCH" "https://oauth2:${K3S_INFRA_PUSH_TOKEN}@${K3S_INFRA_REPO}" "$WORKDIR"

      cd "$WORKDIR"

      git config user.email "ci-rentas-if@gitlab.local"
      git config user.name "CI Rentas IF"

      mkdir -p "$(dirname "$FRONTEND_PATCH_FILE")"

      cat > "$FRONTEND_PATCH_FILE" <<EOF
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rentas-if-frontend
        namespace: rentas-if
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: gitlab-registry-frontend
            containers:
              - name: web
                image: ${IMAGE_TAG}
      EOF

      git diff -- "$FRONTEND_PATCH_FILE"

      if git diff --quiet -- "$FRONTEND_PATCH_FILE"; then
        echo "No hay cambios para promover."
        exit 0
      fi

      git add "$FRONTEND_PATCH_FILE"
      git commit -m "chore prod actualiza imagen frontend a ${CI_COMMIT_SHORT_SHA}"
      git push origin HEAD:"$K3S_INFRA_BRANCH"
